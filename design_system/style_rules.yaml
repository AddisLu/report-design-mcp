# build_deck 會自動套用的規則（可自行增修）

# 自動替換：大陸用語 → 台灣用語
replacements:
  信息: 資訊
  軟件: 軟體
  硬件: 硬體
  視頻: 影片
  默認: 預設
  質量: 品質
  網絡: 網路
  屏幕: 螢幕
  打印: 列印
  文檔: 文件
  數據庫: 資料庫
  服務器: 伺服器
  菜單: 選單
  激活: 啟用

# 沒有搭配數字時會提醒「偏空泛」
vague_phrases: [持續努力, 積極推動, 大幅提升, 顯著改善, 穩步推進, 有效提升, 全面優化, 進一步加強, 取得良好成效, 持續關注]

# 出現就提醒（例如公司不允許的說法）
banned_phrases: []
